<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign Up</title>
</head>
<body>
    <div id="left_side">
        <h1 id="h1_left">Sign Up Form Project 1.0</h1>
        <img src="bg_image.jpg" id="img_bg" alt="signup">
    </div>

    <div id="right_side">
        <h3>This is not a real online service!</h3>

        <div id="signup_div">
            <form action="signup">
                <label for="firstname">First Name</label>
                <input type="text" name="firstname" id="firstname" placeholder="Alessandro">

                <label for="lastname">Last Name</label>
                <input type="text" name="lastname" id="lastname" placeholder="Rossi">


            </form>
        </div>
    </div>
</body>
</html>
